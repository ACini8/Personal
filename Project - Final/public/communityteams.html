<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Grand Prix Network | Community Teams</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="home.html">
            <img class="brand-logo" src="images/logo-badge.png" alt="" width="117" height="44" />
            <span class="brand-name">The Grand Prix Network</span>
        </a>

        <input type="checkbox" id="navToggle" class="nav-toggle" />
        <label for="navToggle" class="nav-toggle-label" aria-label="Toggle navigation">&#9776;</label>

        <nav aria-label="Main">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="racerecaps.html">Race Recaps</a></li>
                <li><a href="standings.html">Standings</a></li>
                <li><a href="f1fantasy.html" aria-current="true">F1 Fantasy</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Community Teams</h1>
        <p class="page-actions"><a class="btn" href="form.html">+ Add your team</a></p>
        <section class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <p>Loading community teams...</p>
        </section>

        <section class="error-state hidden" id="errorState">
            <p>⚠️ Unable to load teams. Please try again later.</p>
            <button onclick="loadTeams()" class="btn">Retry</button>
        </section>

        <section class="teams-grid hidden" id="teamsGrid">
            <!-- Teams will be dynamically rendered here -->
        </section>
    </main>

    <footer>
        <hr /> <!-- This outputs a horizontal line-->
        <p><small>Andre Cini - The Grand Prix Network - Community Teams</small></p>
    </footer>

    <script src="app.js" defer></script>
</body>

</html>
